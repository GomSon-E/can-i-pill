name: CI Tests

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend tests
        run: |
          pip install -r backend/requirements.txt
          python -m pytest backend/tests

      - name: AI server tests
        working-directory: ai_server
        env:
          GEMINI_API_KEY: dummy-ci-key
        run: |
          pip install -r requirements.txt
          python -m pytest tests --ignore=tests/test_mock_ai.py --ignore=tests/test_ai_mock_mode.py
          AI_MOCK_MODE=true python -m pytest tests/test_mock_ai.py tests/test_ai_mock_mode.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build
