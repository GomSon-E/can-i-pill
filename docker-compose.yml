services:
  ai_server:
    build:
      context: ./ai_server
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AI_SERVER_URL=http://ai_server:8001
    depends_on:
      - ai_server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
