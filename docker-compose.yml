services:
  ai_server:
    build:
      context: ./ai_server
    ports:
      - "${AI_SERVER_PORT:-8001}:8001"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - BACKEND_URL=http://backend:8000
      - AI_METRICS_CSV_PATH=/app/data/metrics.csv
      - AI_ANALYZE_LOGS_PATH=/app/data/analyze_logs.jsonl
    volumes:
      - ./ai_server/data:/app/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      - AI_SERVER_URL=http://ai_server:8001
    depends_on:
      - ai_server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_HOST: ${BACKEND_HOST:-backend}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
